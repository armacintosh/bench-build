  <text x="44.0" y="259.0" text-anchor="middle" transform="rotate(-90 44.0 259.0)" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0f172a">48.00&quot; (4 ft Width)</text>

  <!-- Bottom Part Width Dimensions -->
  <line x1="70.0" y1="483.0" x2="737.25" y2="483.0" stroke="#0f172a" stroke-width="1.3" marker-start="url(#arr)" marker-end="url(#arr)"/>
