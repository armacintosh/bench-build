  <line x1="70.0" y1="257.9375" x2="886.0" y2="257.9375" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="70.0" y1="386.92499999999995" x2="738.3125" y2="386.92499999999995" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>
  <line x1="737.76" y1="55.0" x2="737.76" y2="386.92499999999995" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6,4"/>

