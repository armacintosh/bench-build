  <line x1="70.0" y1="41.0" x2="886.0" y2="41.0" stroke="#0f172a" stroke-width="1.4" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="478.0" y="36.0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0f172a">96.00&quot; (8 ft Full Sheet Length)</text>

