  <line x1="442.79999999999995" y1="148.5" x2="485.5" y2="166.8" stroke="#9a3412" stroke-width="1.4" marker-end="url(#redArr)"/>

  <!-- Overall Y Depth Dimension (29.00") -->
  <line x1="150.0" y1="587.0" x2="503.79999999999995" y2="587.0" stroke="#1e3a8a" stroke-width="1.6" marker-start="url(#bpArr)" marker-end="url(#bpArr)"/>
  <text x="326.9" y="603.0" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="800" fill="#1e3a8a">
