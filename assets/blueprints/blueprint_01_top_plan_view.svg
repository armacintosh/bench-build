  <rect x="159.15" y="540.425" width="42.699999999999996" height="4.574999999999999" fill="#1e293b" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Front 4x4 Leg (Y=0.75..4.25, Z=0.375..19.00, notched at Y=0.75..2.25, Z=15.50..19.00) -->
  <polygon points="159.2,540.4 201.8,540.4 201.8,313.2 177.4,313.2 177.4,355.9 159.2,355.9" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="180.5" y="423.0" text-anchor="middle" transform="rotate(-90 180.5 423.0)" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1e3a8a">
