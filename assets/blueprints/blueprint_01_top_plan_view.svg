  <rect x="159.15" y="313.20000000000005" width="18.299999999999997" height="42.699999999999996" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="159.15" y1="313.20000000000005" x2="177.45" y2="355.9" stroke="#b45309" stroke-width="1"/>
  <rect x="177.45" y="313.20000000000005" width="18.299999999999997" height="42.699999999999996" fill="#fcd34d" stroke="#b45309" stroke-width="2"/>
  <line x1="177.45" y1="313.20000000000005" x2="195.75" y2="355.9" stroke="#b45309" stroke-width="1"/>

