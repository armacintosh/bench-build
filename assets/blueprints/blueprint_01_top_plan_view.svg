  <polygon points="458.0,355.9 475.7,355.9 475.7,304.1 516.5,72.7 498.8,72.7 458.0,304.1" fill="#fdba74" stroke="#c2410c" stroke-width="2.2"/>
  <!-- Backrest 3/4" Plywood Panel -->
  <polygon points="456.5,261.4 465.6,261.4 497.3,81.2 488.2,81.2" fill="#fed7aa" stroke="#9a3412" stroke-width="2"/>

