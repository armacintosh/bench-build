  <rect x="424.5" y="529.75" width="24.4" height="12.2" fill="#475569" stroke="#0f172a" stroke-width="1"/>
  <circle cx="436.7" cy="538.29" r="6.71" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.8"/>
  <!-- Rear 4x4 Leg (Y=21.75..25.25, Z=0.375..19.00, notched at Y=23.75..25.25, Z=15.50..19.00) -->
  <polygon points="415.3,540.4 458.0,540.4 458.0,355.9 439.8,355.9 439.8,313.2 415.3,313.2" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2" fill-opacity="0.88"/>
  <text x="431.82" y="423.0" text-anchor="middle" transform="rotate(-90 431.82 423.0)" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1e3a8a">
