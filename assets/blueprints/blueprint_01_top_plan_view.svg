  <rect x="195.75" y="313.20000000000005" width="244.0" height="42.699999999999996" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="317.75" y="337.6" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#92400e">
