  </text>

  <!-- Floor Datum Line Z = 0.00" -->
  <line x1="40" y1="545.0" x2="920" y2="545.0" stroke="#334155" stroke-width="2.5"/>
  <text x="48" y="563.0" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#334155">
