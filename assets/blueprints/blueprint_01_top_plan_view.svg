  <line x1="88" y1="545.0" x2="88" y2="355.9" stroke="#1e3a8a" stroke-width="1.5" marker-start="url(#bpArr)" marker-end="url(#bpArr)"/>
  <text x="80" y="450.45" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1e3a8a">15.50&quot; Clear</text>

  <line x1="88" y1="355.9" x2="88" y2="313.20000000000005" stroke="#1e3a8a" stroke-width="1.5" marker-start="url(#bpArr)" marker-end="url(#bpArr)"/>
  <text x="80" y="334.55" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#1e3a8a">Z=15.5..19.0&quot;</text>

