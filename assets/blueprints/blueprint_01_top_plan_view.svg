  </text>

  <!-- Under-Bench Basket Zone Highlight (Z=0 to 15.50", Y=0.75 to 21.75") -->
  <rect x="159.15" y="355.9" width="256.2" height="189.1" fill="#e0f2fe" fill-opacity="0.45" stroke="#0284c7" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="287.25" y="441.3" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#0369a1">
