  <rect x="150.0" y="291.85" width="9.149999999999999" height="67.1" fill="#a78bfa" stroke="#4c1d95" stroke-width="2"/>
  <rect x="494.65" y="291.85" width="9.149999999999999" height="67.1" fill="#a78bfa" stroke="#4c1d95" stroke-width="2"/>

