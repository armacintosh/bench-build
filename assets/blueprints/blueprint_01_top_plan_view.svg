  <text x="80" y="307.71000000000004" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700" fill="#b45309">19.75&quot; Deck</text>

  <line x1="88" y1="304.05" x2="88" y2="291.85" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="293.07000000000005" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#dc2626">20.75&quot; Lip (+1&quot;)</text>

