  <line x1="174.4" y1="232.68" x2="154.88" y2="291.24" stroke="#4c1d95" stroke-width="1.4" marker-end="url(#bpArr)"/>

  <text x="333.0" y="136.3" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#9a3412">
