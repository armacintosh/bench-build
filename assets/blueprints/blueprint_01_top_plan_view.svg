  </text>

  <!-- Main Structural Back Rail (Y=23.75..25.25, Z=15.50..19.00) -->
  <rect x="439.75" y="313.20000000000005" width="18.299999999999997" height="42.699999999999996" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
